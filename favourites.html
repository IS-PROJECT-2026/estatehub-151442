<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Properties | EstateHub</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header class="navbar">
        <div class="nav-container">

            <a href="index.html" class="logo">
                Estate<span>Hub</span>
            </a>

            <button
                class="menu-toggle"
                aria-label="Toggle navigation"
                aria-expanded="false"
            >
                ☰
            </button>

            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="properties.html" class="active">Properties</a>
                <a href="favourites.html">Favourites</a>
                <a href="admin.html">Admin</a>
            </nav>

        </div>
    </header>
    <main>
    <section class="page-hero">
        <div class="container">
            <h1>My Favourites</h1>
            <p>View and manage properties you have saved.</p>
        </div>
    </section>

    <section class="properties-section">
        <div class="container">

            <div class="section-heading">
                <h2>Saved Properties</h2>
                <p id="favourites-count">0 properties saved</p>
            </div>

            <div
                id="favourites-container"
                class="properties-grid"
            ></div>

            <div
                id="empty-favourites"
                class="empty-state"
                hidden
            >
                <h2>No favourite properties yet</h2>

                <p>
                    Browse our available properties and save the ones
                    you are interested in.
                </p>

                <a href="properties.html" class="btn">
                    Browse Properties
                </a>
            </div>

        </div>
    </section>
</main>
    

    <script src="js/properties.js"></script>
    <script src="js/app.js"></script>
    <script src="js/properties.js"></script>
    <script src="js/favourites.js"></script>

</body>
</html>
